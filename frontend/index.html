<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>1 000 000 ПИКСЕЛЕЙ</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Шапка -->
  <header>
    <div class="logo">🧩 1 000 000 ПИКСЕЛЕЙ</div>
    <nav>
      <a href="#">Полотно</a>
      <a href="#">Купить</a>
      <a href="#" id="loginBtn">Войти</a>
    </nav>
  </header>

  <!-- Герой -->
  <section class="hero">
    <h1>КУПИ СВОЙ КУСОЧЕК ИНТЕРНЕТА</h1>
    <p>1 000 000 пикселей. 10 ₸ за пиксель.</p>
    <div class="stats">
      <span>Продано: <strong id="soldCount">0</strong> / 1 000 000</span>
      <div class="progress-bar"><div id="progressFill" style="width:0%"></div></div>
    </div>
  </section>

  <!-- Канвас -->
  <section class="board-container">
    <div class="controls">
      <button id="zoomIn">➕</button>
      <button id="zoomOut">➖</button>
      <button id="resetView">⟲ Сброс</button>
    </div>
    <div class="canvas-wrapper">
      <canvas id="pixelCanvas" width="1000" height="1000"></canvas>
    </div>
    <!-- Инфо-панель при выборе -->
    <div id="infoPanel" class="info-panel hidden">
      <h3>Выбрана область</h3>
      <p id="infoSize">Размер: 0 x 0</p>
      <p id="infoPrice">Цена: 0 ₸</p>
      <button id="buyBtn" class="btn-primary">Купить</button>
      <button id="cancelBtn" class="btn-secondary">Отмена</button>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
